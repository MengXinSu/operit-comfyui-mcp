[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "operit-comfyui-mcp"
version = "0.1.0"
description = "MCP server for full ComfyUI control from Operit"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "CC-BY-NC-4.0"}
dependencies = [
    "mcp>=1.0.0",
    "fastmcp>=3.0.0",
    "httpx>=0.28.0",
    "websocket-client>=1.8.0",
    "Pillow>=10.0.0",
]

[project.scripts]
operit-comfyui-mcp = "operit_comfyui_mcp.__main__:main"

[tool.hatch.build.targets.wheel]
packages = ["src/operit_comfyui_mcp"]

[tool.pytest.ini_options]
testpaths = ["tests"]
